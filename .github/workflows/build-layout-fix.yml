name: Legacy Arcane Syntax 1.2 packaging (manual)

# Historical resource-only packager. New versions use a full Gradle build.
# Do not let a new version's source push overwrite the published 1.2 artifact.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package verified Arcane Syntax 1.2 test build
        run: python3 tools/patch_focus_layout.py
      - name: Upload 1.2 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcane_syntax_unified-1.2
          path: dist/1.2/arcane_syntax_unified-1.2.jar
          if-no-files-found: error
      - name: Publish version 1.2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.2"
          jar="dist/1.2/arcane_syntax_unified-1.2.jar"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$jar" --clobber
          else
            gh release create "$tag" "$jar" --target "$GITHUB_SHA" --prerelease \
              --title "Arcane Syntax 1.2 — Thaumonomicon focus layout correction" \
              --notes "New simplified version numbering consistent with CurseForge's 1.1.0 predecessor. Corrects Advanced Foci (column 2, row -4) and Greater Foci (column 4, row -3) in the Thaumonomicon. Recipes, progression prerequisites and spell logic are unchanged. The JAR name and embedded mod version are both 1.2. Experimental Thaumaturge 1.1.0 compatibility build; requires matching pack KubeJS scripts for Eldritch Aeons progression. Install only one Arcane Syntax JAR."
          fi
